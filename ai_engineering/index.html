<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Materials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-void: #10131a;
      --bg-panel: #171b24;
      --bg-panel-raised: #1e232f;
      --bg-inset: #0c0e13;
      --border: #2a3040;
      --text-primary: #e7eaf1;
      --text-secondary: #9aa3b5;
      --text-dim: #656e80;
      --accent: #5eead4;
      --accent-soft: rgba(94, 234, 212, 0.12);
      --accent-strong: #99f6e8;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans);
      background: radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94, 234, 212, 0.06), transparent 60%),
                  radial-gradient(ellipse 700px 500px at 100% 0%, rgba(196, 181, 253, 0.05), transparent 60%),
                  var(--bg-void);
      background-attachment: fixed;
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: 0;
    }
    .wrapper { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; position: relative; z-index: 1; }
    .sidebar {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      padding: 24px;
      overflow-y: auto;
      max-height: 100vh;
      position: sticky;
      top: 0;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .sidebar-header::before { content: '◆'; font-size: 14px; }
    .nav-section { margin-bottom: 24px; }
    .nav-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-family: var(--mono);
    }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .nav-link {
      display: block;
      padding: 8px 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .nav-link:hover { color: var(--accent); background: var(--accent-soft); }
    .nav-link.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .toc-link {
      display: block;
      padding: 4px 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 12px;
      border-radius: 3px;
      transition: all 0.2s;
    }
    .toc-link:hover { color: var(--accent); background: var(--accent-soft); }
    .toc-link.level-2 { padding-left: 20px; }
    .toc-link.level-3 { padding-left: 28px; }
    .main { display: flex; flex-direction: column; }
    .header {
      background: rgba(16, 19, 26, 0.9);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .header-actions { display: flex; gap: 12px; }
    .back-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--mono);
      transition: all 0.2s;
      text-decoration: none;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .content { flex: 1; padding: 40px; max-width: 900px; margin: 0 auto; width: 100%; }
    .markdown {
      color: var(--text-primary);
    }
    .markdown h1 { font-size: 36px; font-weight: 700; margin: 32px 0 16px 0; color: var(--text-primary); }
    .markdown h1:first-child { margin-top: 0; }
    .markdown h2 { font-size: 28px; font-weight: 700; margin: 28px 0 12px 0; padding-top: 16px; border-top: 1px solid var(--border); color: var(--text-primary); }
    .markdown h3 { font-size: 22px; font-weight: 600; margin: 20px 0 8px 0; color: var(--text-secondary); }
    .markdown p { margin-bottom: 16px; line-height: 1.7; }
    .markdown a { color: var(--accent); text-decoration: none; }
    .markdown a:hover { color: var(--accent-strong); text-decoration: underline; }
    .markdown strong { color: var(--accent); font-weight: 600; }
    .markdown ul, .markdown ol { margin: 16px 0 16px 24px; }
    .markdown li { margin-bottom: 8px; }
    .markdown blockquote { border-left: 3px solid var(--accent); padding: 12px 16px; margin: 16px 0; background: var(--accent-soft); border-radius: 4px; color: var(--text-secondary); }
    .markdown code:not(pre code) { background: var(--bg-inset); color: #98c379; padding: 2px 6px; border-radius: 3px; font-family: var(--mono); font-size: 13px; border: 1px solid var(--border); }
    .markdown pre { background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin: 20px 0; overflow-x: auto; position: relative; }
    .markdown pre code { color: var(--text-primary); font-family: var(--mono); font-size: 13px; line-height: 1.5; }
    .copy-code-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-family: var(--mono);
      opacity: 0;
      transition: all 0.2s;
    }
    .markdown pre:hover .copy-code-btn { opacity: 1; }
    .copy-code-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .markdown table { width: 100%; border-collapse: collapse; margin: 20px 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .markdown thead { background: var(--bg-panel-raised); }
    .markdown th { padding: 12px; text-align: left; font-weight: 600; color: var(--accent); border-bottom: 1px solid var(--border); }
    .markdown td { padding: 12px; border-bottom: 1px solid var(--border); }
    .markdown tbody tr:hover { background: var(--bg-panel); }
    .error { background: rgba(240, 128, 110, 0.1); border: 1px solid rgba(240, 128, 110, 0.3); color: #f0806e; padding: 20px; border-radius: 8px; }
    @media (max-width: 1024px) {
      .wrapper { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .content { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <aside class="sidebar">
      <div class="sidebar-header">Materials</div>
      <div class="nav-section">
        <div class="nav-label">Topics</div>
        <ul class="nav-list">
          <li><a href="../" class="nav-link">Overview</a></li>
          <li><a href="llm/" class="nav-link">LLM Fundamentals</a></li>
          <li><a href="embeddings/" class="nav-link">Embeddings</a></li>
          <li><a href="vector_databases/" class="nav-link">Vector Databases</a></li>
          <li><a href="rag/" class="nav-link">RAG Systems</a></li>
          <li><a href="agentic/" class="nav-link">Agentic AI</a></li>
        </ul>
      </div>
      <div class="nav-section">
        <div class="nav-label">Navigate</div>
        <ul class="nav-list">
          <li><a href="../../index.html" class="nav-link">← Hub</a></li>
        </ul>
      </div>
      <div id="toc" class="nav-section" style="display: none;">
        <div class="nav-label">Contents</div>
        <ul class="nav-list" id="tocList"></ul>
      </div>
    </aside>
    <div class="main">
      <header class="header">
        <div class="header-title">Learning Materials</div>
        <div class="header-actions">
          <a href="../../index.html" class="back-btn">← Hub</a>
        </div>
      </header>
      <div class="content markdown" id="content">Loading...</div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@13/dist/markdown-it.min.js"></script>
  <script>
    async function load() {
      try {
        const response = await fetch('README.md');
        const markdown = await response.text();
        const md = window.markdownit({ html: true, breaks: true, linkify: true });
        const html = md.render(markdown);
        document.getElementById('content').innerHTML = html;
        document.querySelectorAll('pre').forEach(pre => {
          const btn = document.createElement('button');
          btn.className = 'copy-code-btn';
          btn.textContent = 'Copy';
          btn.onclick = function() { copyCode(this); };
          pre.appendChild(btn);
        });
        document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
        buildTOC();
      } catch (e) {
        document.getElementById('content').innerHTML = `<div class="error">Error loading README.md: ${e.message}</div>`;
      }
    }
    function buildTOC() {
      const headings = document.querySelectorAll('.markdown h2, .markdown h3');
      const tocList = document.getElementById('tocList');
      tocList.innerHTML = '';
      if (headings.length > 0) {
        document.getElementById('toc').style.display = 'block';
        headings.forEach((h, i) => {
          h.id = `h${i}`;
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = `#h${i}`;
          a.className = `toc-link ${h.tagName === 'H3' ? 'level-3' : 'level-2'}`;
          a.textContent = h.textContent;
          li.appendChild(a);
          tocList.appendChild(li);
        });
      }
    }
    function copyCode(btn) {
      const code = btn.nextElementSibling.textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = '✓ Copied';
        setTimeout(() => btn.textContent = 'Copy', 2000);
      });
    }
    load();
  </script>
</body>
</html>
