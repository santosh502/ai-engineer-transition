<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-void: #10131a;
      --bg-panel: #171b24;
      --bg-panel-raised: #1e232f;
      --bg-inset: #0c0e13;
      --border: #2a3040;
      --text-primary: #e7eaf1;
      --text-secondary: #9aa3b5;
      --text-dim: #656e80;
      --accent: #5eead4;
      --accent-soft: rgba(94, 234, 212, 0.12);
      --accent-strong: #99f6e8;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans);
      background: radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94, 234, 212, 0.06), transparent 60%),
                  radial-gradient(ellipse 700px 500px at 100% 0%, rgba(196, 181, 253, 0.05), transparent 60%),
                  var(--bg-void);
      background-attachment: fixed;
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: 0;
    }
    .wrapper { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; position: relative; z-index: 1; }
    .sidebar {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      padding: 24px;
      overflow-y: auto;
      max-height: 100vh;
      position: sticky;
      top: 0;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .sidebar-header::before { content: '◆'; font-size: 14px; }
    .nav-section { margin-bottom: 16px; }
    .nav-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-family: var(--mono);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .nav-label:hover {
      color: var(--text-secondary);
      background: var(--accent-soft);
    }
    .nav-label::before {
      content: '▶';
      font-size: 10px;
      transition: transform 0.2s;
      display: inline-block;
      width: 12px;
    }
    .nav-label.expanded::before {
      transform: rotate(90deg);
    }
    .nav-section.collapsed .nav-list {
      display: none;
    }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 1px; }
    .nav-item { display: block; }
    .nav-item:first-child .nav-link { padding-top: 8px; }
    .nav-link {
      display: block;
      padding: 6px 12px 6px 32px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 12px;
      border-radius: 0;
      transition: all 0.2s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-left: 2px solid transparent;
      position: relative;
    }
    .nav-link::before {
      content: '•';
      position: absolute;
      left: 16px;
      color: var(--text-dim);
      font-weight: bold;
    }
    .nav-link:hover {
      color: var(--accent);
      background: var(--accent-soft);
      border-left-color: var(--accent);
    }
    .nav-link.active {
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 600;
      border-left-color: var(--accent);
    }
    .main { display: flex; flex-direction: column; }
    .header {
      background: rgba(16, 19, 26, 0.9);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-title { font-size: 16px; font-weight: 600; color: var(--text-primary); max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-actions { display: flex; gap: 12px; }
    .btn {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--mono);
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .content { flex: 1; padding: 40px; max-width: 900px; margin: 0 auto; width: 100%; }
    .markdown { color: var(--text-primary); }
    .markdown h1 { font-size: 36px; font-weight: 700; margin: 32px 0 16px 0; color: var(--text-primary); }
    .markdown h1:first-child { margin-top: 0; }
    .markdown h2 { font-size: 28px; font-weight: 700; margin: 28px 0 12px 0; padding-top: 16px; border-top: 1px solid var(--border); color: var(--text-primary); }
    .markdown h3 { font-size: 22px; font-weight: 600; margin: 20px 0 8px 0; color: var(--text-secondary); }
    .markdown p { margin-bottom: 16px; line-height: 1.7; }
    .markdown a { color: var(--accent); text-decoration: none; }
    .markdown a:hover { color: var(--accent-strong); text-decoration: underline; }
    .markdown strong { color: var(--accent); font-weight: 600; }
    .markdown ul, .markdown ol { margin: 16px 0 16px 24px; }
    .markdown li { margin-bottom: 8px; }
    .markdown blockquote { border-left: 3px solid var(--accent); padding: 12px 16px; margin: 16px 0; background: var(--accent-soft); border-radius: 4px; color: var(--text-secondary); }
    .markdown code:not(pre code) { background: var(--bg-inset); color: #98c379; padding: 2px 6px; border-radius: 3px; font-family: var(--mono); font-size: 13px; border: 1px solid var(--border); }
    .markdown pre { background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin: 20px 0; overflow-x: auto; position: relative; }
    .markdown pre code { color: var(--text-primary); font-family: var(--mono); font-size: 13px; line-height: 1.5; }
    .copy-code-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-family: var(--mono);
      opacity: 0;
      transition: all 0.2s;
    }
    .markdown pre:hover .copy-code-btn { opacity: 1; }
    .copy-code-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .markdown table { width: 100%; border-collapse: collapse; margin: 20px 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .markdown thead { background: var(--bg-panel-raised); }
    .markdown th { padding: 12px; text-align: left; font-weight: 600; color: var(--accent); border-bottom: 1px solid var(--border); }
    .markdown td { padding: 12px; border-bottom: 1px solid var(--border); }
    .markdown tbody tr:hover { background: var(--bg-panel); }
    .markdown img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--border); margin: 20px 0; }
    .footer-nav { display: flex; gap: 12px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); }
    .footer-nav a { flex: 1; }
    .footer-nav .btn { width: 100%; text-align: center; }
    .loading, .error { text-align: center; padding: 40px; }
    .error { background: rgba(240, 128, 110, 0.1); border: 1px solid rgba(240, 128, 110, 0.3); color: #f0806e; border-radius: 8px; }
    @media (max-width: 1024px) {
      .wrapper { grid-template-columns: 1fr; }
      .sidebar { display: none; position: fixed; left: 0; top: 0; width: 280px; height: 100vh; z-index: 150; }
      .content { padding: 24px; }
      .header-title { max-width: 50%; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <aside class="sidebar">
      <div class="sidebar-header">Chapters</div>
      <div id="sidebarNav"></div>
      <div class="nav-section" style="margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border);">
        <div class="nav-label">Navigate</div>
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">← Back to Hub</a></li>
        </ul>
      </div>
    </aside>

    <div class="main">
      <header class="header">
        <div class="header-title" id="headerTitle">Loading...</div>
        <div class="header-actions">
          <a href="index.html" class="btn">← Hub</a>
        </div>
      </header>

      <div class="content markdown" id="content">Loading...</div>

      <div class="footer-nav" id="footerNav">
        <button class="btn" id="prevBtn" onclick="goToPrevious()">← Previous</button>
        <button class="btn" id="nextBtn" onclick="goToNext()">Next →</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@13/dist/markdown-it.min.js"></script>

  <script>
    // Chapter structure
    const chapters = [
      { title: 'AI Engineering Overview', file: 'ai_engineering/README.md', section: 'Overview' },

      { title: 'LLM Fundamentals', file: 'ai_engineering/llm/README.md', section: 'LLM' },
      { title: 'Attention is All You Need', file: 'ai_engineering/llm/00_attention_is_all_you_need.md', section: 'LLM' },
      { title: 'LLM Fundamentals Guide', file: 'ai_engineering/llm/01_llm_fundamentals.md', section: 'LLM' },
      { title: 'Practical Examples', file: 'ai_engineering/llm/02_practical_examples.md', section: 'LLM' },
      { title: 'Quick Reference', file: 'ai_engineering/llm/03_quick_reference.md', section: 'LLM' },
      { title: 'Hard Problems', file: 'ai_engineering/llm/04_hard_problems.md', section: 'LLM' },
      { title: 'Prompt Engineering', file: 'ai_engineering/llm/05_prompt_engineering.md', section: 'LLM' },

      { title: 'Embeddings & Vectors', file: 'ai_engineering/embeddings/README.md', section: 'Embeddings' },
      { title: 'Embeddings Guide', file: 'ai_engineering/embeddings/00_embeddings_guide.md', section: 'Embeddings' },
      { title: 'Practical Code Examples', file: 'ai_engineering/embeddings/01_practical_code_examples.md', section: 'Embeddings' },
      { title: 'Quick Reference', file: 'ai_engineering/embeddings/02_quick_reference.md', section: 'Embeddings' },

      { title: 'Vector Databases', file: 'ai_engineering/vector_databases/README.md', section: 'Vector DB' },
      { title: 'Vector Databases Guide', file: 'ai_engineering/vector_databases/00_vector_databases_guide.md', section: 'Vector DB' },
      { title: 'Practical Code Examples', file: 'ai_engineering/vector_databases/01_practical_code_examples.md', section: 'Vector DB' },
      { title: 'Quick Reference', file: 'ai_engineering/vector_databases/02_quick_reference.md', section: 'Vector DB' },

      { title: 'RAG Systems', file: 'ai_engineering/rag/README.md', section: 'RAG' },
      { title: 'Architecture Overview', file: 'ai_engineering/rag/00_architecture_overview.md', section: 'RAG' },
      { title: 'Comprehensive Study Guide', file: 'ai_engineering/rag/01_notes.md', section: 'RAG' },
      { title: 'Chunking Strategies', file: 'ai_engineering/rag/02_chunking_strategies.md', section: 'RAG' },
      { title: 'Implementation Examples', file: 'ai_engineering/rag/03_implementation_examples.md', section: 'RAG' },
      { title: 'Troubleshooting Guide', file: 'ai_engineering/rag/04_troubleshooting.md', section: 'RAG' },
      { title: 'Quick Reference', file: 'ai_engineering/rag/05_quick_reference.md', section: 'RAG' },

      { title: 'Agentic AI', file: 'ai_engineering/agentic/README.md', section: 'Agentic' },
    ];

    let currentIndex = 0;
    const params = new URLSearchParams(window.location.search);
    const currentFile = params.get('file') || chapters[0].file;

    // Find current chapter index
    currentIndex = chapters.findIndex(ch => ch.file === currentFile);
    if (currentIndex === -1) currentIndex = 0;

    const headerTitle = document.getElementById('headerTitle');
    const contentEl = document.getElementById('content');
    const sidebarNav = document.getElementById('sidebarNav');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // Build sidebar
    function buildSidebar() {
      const sections = {};

      // Group chapters by section
      chapters.forEach((ch, idx) => {
        if (!sections[ch.section]) {
          sections[ch.section] = [];
        }
        sections[ch.section].push({ ...ch, idx });
      });

      // Build HTML - all sections expanded by default
      let html = '';
      Object.keys(sections).forEach(section => {
        html += `<div class="nav-section" data-section="${section}">
          <div class="nav-label expanded" onclick="toggleSection(this)">📚 ${section}</div>
          <ul class="nav-list">`;

        sections[section].forEach(ch => {
          const isActive = ch.idx === currentIndex ? ' active' : '';
          html += `<li class="nav-item"><a href="?file=${encodeURIComponent(ch.file)}" class="nav-link${isActive}">${ch.title}</a></li>`;
        });

        html += '</ul></div>';
      });

      sidebarNav.innerHTML = html;
    }

    // Toggle section expansion
    window.toggleSection = function(element) {
      const section = element.closest('.nav-section');
      section.classList.toggle('collapsed');
      element.classList.toggle('expanded');
    }

    // Load chapter
    async function loadChapter() {
      const chapter = chapters[currentIndex];
      headerTitle.textContent = chapter.title;
      document.title = chapter.title;

      try {
        const response = await fetch(chapter.file);
        if (!response.ok) throw new Error(`Failed to load ${chapter.file}`);

        const markdown = await response.text();
        const md = window.markdownit({ html: true, breaks: true, linkify: true });
        const html = md.render(markdown);

        contentEl.innerHTML = html;

        // Rewrite internal markdown links to go through reader
        const currentDir = chapter.file.substring(0, chapter.file.lastIndexOf('/') + 1);
        document.querySelectorAll('a').forEach(link => {
          const href = link.getAttribute('href');
          if (href && href.endsWith('.md') && !href.startsWith('http') && !href.startsWith('#')) {
            // Resolve relative paths
            let fullPath = href;
            if (!href.startsWith('/')) {
              fullPath = currentDir + href;
            }
            link.href = `?file=${encodeURIComponent(fullPath)}`;
          }
        });

        // Add copy buttons
        document.querySelectorAll('pre').forEach(pre => {
          const btn = document.createElement('button');
          btn.className = 'copy-code-btn';
          btn.textContent = 'Copy';
          btn.onclick = function() { copyCode(this); };
          pre.appendChild(btn);
        });

        // Highlight code
        document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

        // Update nav buttons
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === chapters.length - 1;

        // Update active nav link
        buildSidebar();
        window.scrollTo(0, 0);

      } catch (error) {
        contentEl.innerHTML = `<div class="error">Error: ${error.message}</div>`;
      }
    }

    function goToPrevious() {
      if (currentIndex > 0) {
        currentIndex--;
        const file = chapters[currentIndex].file;
        window.location.href = `?file=${encodeURIComponent(file)}`;
      }
    }

    function goToNext() {
      if (currentIndex < chapters.length - 1) {
        currentIndex++;
        const file = chapters[currentIndex].file;
        window.location.href = `?file=${encodeURIComponent(file)}`;
      }
    }

    function copyCode(btn) {
      const code = btn.nextElementSibling.textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = '✓ Copied';
        setTimeout(() => btn.textContent = 'Copy', 2000);
      });
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') goToPrevious();
      if (e.key === 'ArrowRight') goToNext();
    });

    loadChapter();
  </script>
</body>
</html>
