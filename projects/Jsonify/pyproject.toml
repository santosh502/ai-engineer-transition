[project]
name = "jsonify"
version = "0.1.0"
description = "Text to JSON extractor CLI with LLM integration, automatic retries, and Pydantic validation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["ollama>=0.6.2", "pydantic[email]>=2.13.5", "tenacity>=9.1.4"]

[dependency-groups]
dev = ["pytest>=7.4.0", "pytest-mock>=3.11.1", "pytest-cov>=4.1.0"]
