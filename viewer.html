<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-void: #10131a;
      --bg-panel: #171b24;
      --bg-panel-raised: #1e232f;
      --bg-inset: #0c0e13;
      --border: #2a3040;
      --border-bright: #3b4356;
      --text-primary: #e7eaf1;
      --text-secondary: #9aa3b5;
      --text-dim: #656e80;
      --accent: #5eead4;
      --accent-soft: rgba(94, 234, 212, 0.12);
      --accent-strong: #99f6e8;
      --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--sans);
      background:
        radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94, 234, 212, 0.06), transparent 60%),
        radial-gradient(ellipse 700px 500px at 100% 0%, rgba(196, 181, 253, 0.05), transparent 60%),
        var(--bg-void);
      background-attachment: fixed;
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: 0;
    }

    .wrapper {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      padding: 24px;
      overflow-y: auto;
      max-height: 100vh;
      position: sticky;
      top: 0;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sidebar-header::before {
      content: '◆';
      font-size: 14px;
    }

    .nav-section {
      margin-bottom: 24px;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-family: var(--mono);
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: block;
    }

    .nav-link {
      display: block;
      padding: 8px 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      border-radius: 4px;
      transition: all 0.2s;
      word-break: break-word;
    }

    .nav-link:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .nav-link.active {
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 600;
    }

    .toc-link {
      display: block;
      padding: 4px 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 12px;
      border-radius: 3px;
      transition: all 0.2s;
      word-break: break-word;
    }

    .toc-link:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .toc-link.active {
      color: var(--accent);
      font-weight: 600;
    }

    .toc-link.level-2 {
      padding-left: 20px;
    }

    .toc-link.level-3 {
      padding-left: 28px;
    }

    /* Main Content */
    .main {
      display: flex;
      flex-direction: column;
    }

    .header {
      background: rgba(16, 19, 26, 0.9);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      max-width: 60%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .back-btn, .copy-link-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--mono);
      transition: all 0.2s;
      text-decoration: none;
    }

    .back-btn:hover, .copy-link-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .content {
      flex: 1;
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .loading {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px;
    }

    .error {
      background: rgba(240, 128, 110, 0.1);
      border: 1px solid rgba(240, 128, 110, 0.3);
      color: #f0806e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    /* Markdown Styles */
    .markdown {
      color: var(--text-primary);
    }

    .markdown h1 {
      font-size: 36px;
      font-weight: 700;
      margin: 32px 0 16px 0;
      color: var(--text-primary);
    }

    .markdown h1:first-child {
      margin-top: 0;
    }

    .markdown h2 {
      font-size: 28px;
      font-weight: 700;
      margin: 28px 0 12px 0;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--text-primary);
      scroll-margin-top: 60px;
    }

    .markdown h3 {
      font-size: 22px;
      font-weight: 600;
      margin: 20px 0 8px 0;
      color: var(--text-secondary);
      scroll-margin-top: 60px;
    }

    .markdown h4 {
      font-size: 16px;
      font-weight: 600;
      margin: 16px 0 6px 0;
      color: var(--text-secondary);
    }

    .markdown p {
      margin-bottom: 16px;
      line-height: 1.7;
    }

    .markdown a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s;
      word-break: break-word;
    }

    .markdown a:hover {
      color: var(--accent-strong);
      text-decoration: underline;
    }

    .markdown strong {
      color: var(--accent);
      font-weight: 600;
    }

    .markdown em {
      color: var(--text-secondary);
      font-style: italic;
    }

    .markdown ul, .markdown ol {
      margin: 16px 0 16px 24px;
    }

    .markdown li {
      margin-bottom: 8px;
    }

    .markdown blockquote {
      border-left: 3px solid var(--accent);
      padding: 12px 16px;
      margin: 16px 0;
      background: var(--accent-soft);
      border-radius: 4px;
      color: var(--text-secondary);
    }

    .markdown code:not(pre code) {
      background: var(--bg-inset);
      color: #98c379;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 13px;
      border: 1px solid var(--border);
    }

    .markdown pre {
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin: 20px 0;
      overflow-x: auto;
      position: relative;
    }

    .markdown pre code {
      color: var(--text-primary);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.5;
    }

    .copy-code-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-family: var(--mono);
      opacity: 0;
      transition: all 0.2s;
    }

    .markdown pre:hover .copy-code-btn {
      opacity: 1;
    }

    .copy-code-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .markdown table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .markdown thead {
      background: var(--bg-panel-raised);
    }

    .markdown th {
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
    }

    .markdown td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .markdown tbody tr:hover {
      background: var(--bg-panel);
    }

    .markdown hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    .markdown img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin: 20px 0;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .wrapper {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        width: 280px;
        height: 100vh;
        z-index: 150;
      }

      .sidebar.open {
        display: block;
      }

      .content {
        padding: 24px;
      }

      .markdown h1 {
        font-size: 28px;
      }

      .markdown h2 {
        font-size: 22px;
      }

      .header-title {
        max-width: 40%;
      }
    }

    @media (max-width: 640px) {
      .header {
        padding: 12px 16px;
      }

      .content {
        padding: 16px;
      }

      .markdown h1 {
        font-size: 24px;
      }

      .markdown h2 {
        font-size: 18px;
      }

      .markdown pre {
        padding: 12px;
        font-size: 11px;
      }

      .header-title {
        max-width: 50%;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- Sidebar with Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">Docs</div>

      <div class="nav-section">
        <div class="nav-label">Learning Materials</div>
        <ul class="nav-list">
          <li class="nav-item">
            <a href="viewer.html?file=ai_engineering/README.md" class="nav-link">Overview</a>
          </li>
          <li class="nav-item">
            <a href="viewer.html?file=ai_engineering/llm/README.md" class="nav-link">LLM Fundamentals</a>
          </li>
          <li class="nav-item">
            <a href="viewer.html?file=ai_engineering/embeddings/README.md" class="nav-link">Embeddings & Vectors</a>
          </li>
          <li class="nav-item">
            <a href="viewer.html?file=ai_engineering/vector_databases/README.md" class="nav-link">Vector Databases</a>
          </li>
          <li class="nav-item">
            <a href="viewer.html?file=ai_engineering/rag/README.md" class="nav-link">RAG Systems</a>
          </li>
          <li class="nav-item">
            <a href="viewer.html?file=ai_engineering/agentic/README.md" class="nav-link">Agentic AI</a>
          </li>
        </ul>
      </div>

      <div class="nav-section">
        <div class="nav-label">Resources</div>
        <ul class="nav-list">
          <li class="nav-item">
            <a href="README.md" class="nav-link">Project README</a>
          </li>
          <li class="nav-item">
            <a href="index.html" class="nav-link">← Back to Hub</a>
          </li>
        </ul>
      </div>

      <div id="toc" class="nav-section" style="display: none;">
        <div class="nav-label">Contents</div>
        <ul class="nav-list" id="tocList"></ul>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main">
      <header class="header">
        <div class="header-title" id="headerTitle">Documentation</div>
        <div class="header-actions">
          <button class="copy-link-btn" id="copyLinkBtn" title="Copy link">📋 Copy Link</button>
          <a href="index.html" class="back-btn">← Hub</a>
        </div>
      </header>

      <div class="content">
        <div id="content" class="markdown loading">Loading documentation...</div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@13/dist/markdown-it.min.js"></script>

  <script>
    const contentEl = document.getElementById('content');
    const headerTitle = document.getElementById('headerTitle');
    const tocList = document.getElementById('tocList');
    const tocSection = document.getElementById('toc');
    const copyLinkBtn = document.getElementById('copyLinkBtn');

    // Get file parameter from URL
    const params = new URLSearchParams(window.location.search);
    let filePath = params.get('file') || 'ai_engineering/README.md';

    // Normalize file path
    if (!filePath.endsWith('.md')) {
      filePath += '/README.md';
    }

    // Update header and page title
    const fileName = filePath.split('/').pop().replace('.md', '');
    headerTitle.textContent = fileName.replace(/([A-Z])/g, ' $1').trim();
    document.title = `${fileName} - Documentation`;

    // Fetch and render markdown
    async function loadMarkdown() {
      try {
        const response = await fetch(filePath);
        if (!response.ok) {
          throw new Error(`Failed to load ${filePath}`);
        }
        const markdown = await response.text();

        // Configure markdown-it
        const md = window.markdownit({ html: true, breaks: true, linkify: true });

        // Convert markdown to HTML
        const html = md.render(markdown);
        contentEl.innerHTML = html;
        contentEl.classList.remove('loading');

        // Add copy buttons to code blocks
        document.querySelectorAll('pre').forEach(pre => {
          const btn = document.createElement('button');
          btn.className = 'copy-code-btn';
          btn.textContent = 'Copy';
          btn.onclick = function() { copyCode(this); };
          pre.appendChild(btn);
        });

        // Highlight code blocks
        document.querySelectorAll('pre code').forEach((el) => {
          hljs.highlightElement(el);
        });

        // Build table of contents
        buildTableOfContents();

        // Update active nav link
        updateActiveNav();

      } catch (error) {
        contentEl.innerHTML = `<div class="error">Error loading documentation: ${error.message}</div>`;
        contentEl.classList.remove('loading');
      }
    }

    function buildTableOfContents() {
      const headings = document.querySelectorAll('.markdown h2, .markdown h3');
      tocList.innerHTML = '';

      if (headings.length === 0) {
        tocSection.style.display = 'none';
        return;
      }

      tocSection.style.display = 'block';

      headings.forEach((heading, index) => {
        const id = `heading-${index}`;
        heading.id = id;

        const level = heading.tagName === 'H3' ? 'level-3' : 'level-2';
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `#${id}`;
        a.className = `toc-link ${level}`;
        a.textContent = heading.textContent;

        a.addEventListener('click', (e) => {
          document.querySelectorAll('.toc-link').forEach(link => link.classList.remove('active'));
          a.classList.add('active');
        });

        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    function updateActiveNav() {
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('active');
        const href = new URL(link.href, window.location.origin);
        const currentFile = new URL(window.location, window.location.origin);
        if (href.search === currentFile.search) {
          link.classList.add('active');
        }
      });
    }

    function copyCode(btn) {
      const code = btn.nextElementSibling.textContent;
      navigator.clipboard.writeText(code).then(() => {
        const originalText = btn.textContent;
        btn.textContent = '✓ Copied';
        setTimeout(() => {
          btn.textContent = originalText;
        }, 2000);
      });
    }

    copyLinkBtn.addEventListener('click', () => {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        const originalText = copyLinkBtn.textContent;
        copyLinkBtn.textContent = '✓ Copied';
        setTimeout(() => {
          copyLinkBtn.textContent = originalText;
        }, 2000);
      });
    });

    // Load markdown on page load
    loadMarkdown();

    // Highlight headings on scroll
    window.addEventListener('scroll', () => {
      const headings = document.querySelectorAll('.markdown h2, .markdown h3');
      headings.forEach((heading, index) => {
        const rect = heading.getBoundingClientRect();
        const tocLinks = document.querySelectorAll('.toc-link');
        if (rect.top < 100 && rect.bottom > 100) {
          tocLinks.forEach(link => link.classList.remove('active'));
          if (tocLinks[index]) tocLinks[index].classList.add('active');
        }
      });
    });
  </script>
</body>
</html>
